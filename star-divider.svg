<svg viewBox="0 0 1000 50" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f0c29" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFA500" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f0c29" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="24" width="1000" height="2" fill="url(#line)"/>

  <g fill="#ffffff">
    <circle cx="150" cy="25" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="25" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="25" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="25" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <circle r="3" fill="#FFA500">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 0,25 L 1000,25 L 0,25"/>
  </circle>
</svg>
